  const DOW = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];

  function fmtDate(iso) {
    const d = new Date(iso + "T00:00:00");
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    return { display: `${dd}/${mm}`, dow: DOW[d.getDay()] };
  }

  function parseDesc(desc) {
    const parts = desc.split(" | ");
    const metrics = [];
    let flow = null;
    for (const p of parts) {
      if (p.startsWith("top buy:") || p.startsWith("top sell:")) {
        const [label, rest] = [p.slice(0, p.indexOf(":")), p.slice(p.indexOf(":") + 1).trim()];
        flow = { label, rest };
      } else {
        metrics.push(p);
      }
    }
    return { metrics, flow };
  }

  function groupByDate(rows) {
    const map = new Map();
    for (const r of rows) {
      if (!map.has(r.date)) map.set(r.date, []);
      map.get(r.date).push(r);
    }
    return [...map.entries()].sort((a, b) => b[0].localeCompare(a[0]));
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function render(filterKind, query) {
    const q = query.trim().toLowerCase();
    const filtered = SIGNALS.filter(r => {
      const isBandar = r.algo.includes("Bandar");
      if (filterKind === "bandar" && !isBandar) return false;
      if (filterKind === "ritel" && isBandar) return false;
      if (!q) return true;
      return r.ticker.toLowerCase().includes(q) || r.desc.toLowerCase().includes(q);
    });

    const daysEl = document.getElementById("days");
    const emptyEl = document.getElementById("emptyState");

    if (filtered.length === 0) {
      daysEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    const grouped = groupByDate(filtered);
    const openCount = q || filterKind !== "all" ? grouped.length : 2;

    daysEl.innerHTML = grouped.map(([date, rows], idx) => {
      const { display, dow } = fmtDate(date);
      const nBandar = rows.filter(r => r.algo.includes("Bandar")).length;
      const nRitel = rows.length - nBandar;
      const isOpen = idx < openCount;

      const rowsHtml = rows.map(r => {
        const isBandar = r.algo.includes("Bandar");
        const { metrics, flow } = parseDesc(r.desc);
        const metricsHtml = metrics.map(m => `<span class="metric">${escapeHtml(m)}</span>`).join("");
        const flowHtml = flow
          ? `<div class="flow-line"><b>${flow.label === "top buy" ? "Top buy" : "Top sell"}:</b> ${escapeHtml(flow.rest)}</div>`
          : "";
        return `
          <div class="signal">
            <div class="signal-top">
              <span class="kind-dot ${isBandar ? "bandar" : "ritel"}"></span>
              <span class="ticker">${escapeHtml(r.ticker)}</span>
              <span class="algo-label">${isBandar ? "Broker Bandar" : "Broker Ritel"}</span>
            </div>
            <div class="metrics">${metricsHtml}</div>
            ${flowHtml}
          </div>`;
      }).join("");

      return `
        <div class="day ${isOpen ? "open" : ""}">
          <button class="day-head" data-date="${date}">
            <span class="day-date">${display}<span class="dow">${dow}</span></span>
            <span class="day-counts">
              ${nBandar ? `<span class="count-pill bandar">🐋 ${nBandar}</span>` : ""}
              ${nRitel ? `<span class="count-pill ritel">🐟 ${nRitel}</span>` : ""}
              <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg>
            </span>
          </button>
          <div class="day-body">${rowsHtml}</div>
        </div>`;
    }).join("");

    daysEl.querySelectorAll(".day-head").forEach(btn => {
      btn.addEventListener("click", () => {
        btn.closest(".day").classList.toggle("open");
      });
    });
  }

  function renderStats() {
    const dates = [...new Set(SIGNALS.map(r => r.date))].sort();
    const nBandar = SIGNALS.filter(r => r.algo.includes("Bandar")).length;
    const nRitel = SIGNALS.length - nBandar;
    const stats = [
      { n: dates.length, l: "Hari bursa" },
      { n: nBandar, l: "Sinyal bandar" },
      { n: nRitel, l: "Sinyal ritel" },
      { n: SIGNALS.length, l: "Total baris" },
    ];
    document.getElementById("stats").innerHTML = stats.map(s =>
      `<div class="stat"><div class="n">${s.n}</div><div class="l">${s.l}</div></div>`
    ).join("");

    if (dates.length) {
      const first = fmtDate(dates[0]).display + "/" + dates[0].slice(0, 4);
      const last = fmtDate(dates[dates.length - 1]).display + "/" + dates[dates.length - 1].slice(0, 4);
      document.getElementById("rangeLabel").textContent = `${first} — ${last}`;
    }
  }

  let currentKind = "all";
  let currentQuery = "";

  document.getElementById("kindFilter").addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    document.querySelectorAll("#kindFilter .chip").forEach(c => c.setAttribute("aria-pressed", "false"));
    btn.setAttribute("aria-pressed", "true");
    currentKind = btn.dataset.kind;
    render(currentKind, currentQuery);
  });

  document.getElementById("q").addEventListener("input", e => {
    currentQuery = e.target.value;
    render(currentKind, currentQuery);
  });

  renderStats();
  render(currentKind, currentQuery);
</script>

</body>
</html>
